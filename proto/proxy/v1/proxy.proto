syntax = "proto3";

package proxy.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/ihgazi/VectorProxy/proto/proxy/v1;proxyv1";

message SearchRequest {
  repeated float vector = 1;
  int32 top_k = 2;
  string collection = 3;
  google.protobuf.Struct filter = 4;
  string query = 5;
}

message SearchResult {
  string id = 1;
  float score = 2;
  google.protobuf.Struct payload = 3;
}

message SearchResponse {
  repeated SearchResult results = 1;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated string collections = 1;
}

message Point {
  string id = 1;
  repeated float vector = 2; // Optional if content is provided
  string content = 3; // The raw text to be automatically embedded
  google.protobuf.Struct payload = 4;
}

message UpsertRequest {
  string collection = 1;
  repeated Point points = 2;
}

message DeleteCollectionRequest {
  string collection = 1;
}

message DeleteCollectionResponse {}

message DeletePointsRequest {
  string collection = 1;
  repeated string ids = 2;
}

message DeletePointsResponse {}

message UpsertResponse {}

service ProxyService {
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc Upsert(UpsertRequest) returns (UpsertResponse);
  rpc DeleteCollection(DeleteCollectionRequest) returns (DeleteCollectionResponse);
  rpc DeletePoints(DeletePointsRequest) returns (DeletePointsResponse);
}
